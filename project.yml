name: Budget
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.0.8"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"

targets:
  Budget:
    type: application
    platform: iOS
    sources:
      - Budget
    # The shared Kotlin core (shared/), built by Gradle into BudgetCore.framework
    # before the app's own code. Needs a JDK 17 or newer.
    preBuildScripts:
      - name: Build the shared core
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ -z "$JAVA_HOME" ] && [ -x /usr/libexec/java_home ]; then
            export JAVA_HOME="$(/usr/libexec/java_home -v 17+ 2>/dev/null || true)"
          fi
          cd "$SRCROOT"
          ./gradlew -Pbudget.iosOnly=true :shared:embedAndSignAppleFrameworkForXcode
    scheme:
      testTargets:
        - BudgetUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.budget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Budget
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework BudgetCore -lsqlite3"
        # The Gradle build above reads and writes outside the sandbox
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  BudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BudgetUITests
    dependencies:
      - target: Budget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.budget.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Budget
        TARGETED_DEVICE_FAMILY: "1,2"
