name: iOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to attach the .ipa to GitHub releases

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PROJECT: Budget.xcodeproj
      SCHEME: Budget
      # Optional, for TestFlight upload (job-level so `if:` can read it)
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Determine app version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(sed -n 's/.*MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml)"
          fi
          echo "App version: $APP_VERSION (build ${{ github.run_number }})"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Check signing secrets
        id: signing
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set: building without code signing."
          fi

      # ---------- Unsigned IPA (always built, for SideStore / AltStore) ----------

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build -quiet

          # An .ipa is just Payload/<App>.app zipped
          OUT="$RUNNER_TEMP/unsigned"
          mkdir -p "$OUT/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Budget.app" "$OUT/Payload/"
          (cd "$OUT" && zip -qry Budget-unsigned.ipa Payload)
          ls -la "$OUT"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Budget-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/unsigned/Budget-unsigned.ipa
          if-no-files-found: error

      # ---------- Signed build ----------

      - name: Install certificate and provisioning profile
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUNDLE_ID_FOR_WILDCARD: ${{ vars.BUNDLE_ID }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PP_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # Temporary keychain holding the signing certificate
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' 'NR==1 {print $2}')"
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::No code signing identity found in the .p12"; exit 1
          fi

          # Read everything we need from the provisioning profile
          security cms -D -i "$PP_PATH" > "$PP_PLIST"
          pb() { /usr/libexec/PlistBuddy -c "Print $1" "$PP_PLIST" 2>/dev/null; }
          PROFILE_UUID="$(pb UUID)"
          TEAM_ID="$(pb TeamIdentifier:0)"
          APP_ID="$(pb Entitlements:application-identifier)"
          BUNDLE_ID="${APP_ID#"$TEAM_ID".}"
          if [[ "$BUNDLE_ID" == *"*"* ]]; then
            BUNDLE_ID="${BUNDLE_ID_FOR_WILDCARD:-com.example.budget}"
          fi

          if pb ProvisionsAllDevices > /dev/null; then
            EXPORT_METHOD=enterprise
          elif pb ProvisionedDevices > /dev/null; then
            if [ "$(pb Entitlements:get-task-allow)" = "true" ]; then
              EXPORT_METHOD=debugging          # development profile
            else
              EXPORT_METHOD=release-testing    # ad hoc profile
            fi
          else
            EXPORT_METHOD=app-store-connect
          fi

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PP_PATH" "$dir/$PROFILE_UUID.mobileprovision"
          done

          echo "Signing '$BUNDLE_ID' (team $TEAM_ID) with '$SIGN_IDENTITY', export method: $EXPORT_METHOD"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "EXPORT_METHOD=$EXPORT_METHOD"
          } >> "$GITHUB_ENV"

      - name: Archive
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Budget.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive -quiet

      - name: Export IPA
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGN_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Budget.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Budget-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Attach IPAs to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          files=("$RUNNER_TEMP/unsigned/Budget-unsigned.ipa")
          if compgen -G "$RUNNER_TEMP/export/*.ipa" > /dev/null; then
            files+=("$RUNNER_TEMP"/export/*.ipa)
          fi

          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes

          # Asset uploads occasionally drop the connection: retry
          for attempt in 1 2 3 4 5; do
            gh release upload "$TAG" "${files[@]}" --clobber && exit 0
            echo "Upload failed (attempt $attempt), retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Upload to TestFlight
        if: >-
          steps.signing.outputs.enabled == 'true' &&
          env.EXPORT_METHOD == 'app-store-connect' &&
          env.ASC_KEY_ID != '' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision"
